<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wllama × LFM2.5-1.2B-JP デモ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px;
        }
        h1 { font-size: 1.1rem; margin-bottom: 8px; color: #7c8cf8; }
        #status { font-size: 0.82rem; color: #a0a0b0; margin-bottom: 8px; min-height: 1.2em; }
        #chat {
            flex: 1; overflow-y: auto; background: #16213e; border-radius: 10px;
            padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px;
        }
        .msg {
            max-width: 85%; padding: 10px 14px; border-radius: 12px;
            line-height: 1.5; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
        }
        .msg.user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: #2a2a4a; border-bottom-left-radius: 4px; }
        .msg.system { align-self: center; background: transparent; color: #7c8cf8; font-size: 0.8rem; text-align: center; }
        #input-area { display: flex; gap: 8px; }
        #input-area textarea {
            flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #333;
            background: #0d1b2a; color: #e0e0e0; font-size: 0.9rem;
            font-family: inherit; resize: none; outline: none;
        }
        #input-area textarea:focus { border-color: #7c8cf8; }
        #input-area button {
            padding: 10px 20px; border: none; border-radius: 10px;
            background: #7c8cf8; color: #fff; font-weight: 600;
            font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
        }
        #input-area button:hover:not(:disabled) { background: #5a6ce0; }
        #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🍊 wllama × LFM2.5-1.2B-JP</h1>
    <div id="status">モデルを初期化中...</div>
    <div id="chat"></div>
    <div id="input-area">
        <textarea id="userInput" rows="2" placeholder="メッセージを入力..." disabled></textarea>
        <button id="sendBtn" disabled>送信</button>
    </div>

    <script type="module">
        import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/index.js';

        // ===== 設定 =====
        const MODEL_URL = 'https://huggingface.co/LiquidAI/LFM2.5-1.2B-JP-202606-GGUF/resolve/main/LFM2.5-1.2B-JP-202606-Q4_K_M.gguf';

        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let wllama = null;
        let isGenerating = false;
        let chatHistory = [
            { role: 'system', content: 'あなたは親切で丁寧な日本語アシスタントです。ユーザーの質問に簡潔に答えてください。' }
        ];

        // ===== UI ヘルパー =====
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function setStatus(text) { statusEl.textContent = text; }
        function setUIEnabled(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
        }

        // ===== wllama 初期化 =====
        async function initModel() {
            try {
                // ✅ v3 では pathConfig のキーに 'default' が必要
                wllama = new Wllama({
                    'default': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/wasm/wllama.wasm',
                });

                setStatus('モデルをダウンロード中... (初回は約700MB)');

                // ✅ v3 では loadModelFromUrl にオブジェクトを渡す
                await wllama.loadModelFromUrl({
                    url: MODEL_URL,
                }, {
                    n_ctx: 4096,
                    n_batch: 512,
                    n_threads: navigator.hardwareConcurrency || 4,
                    progressCallback: ({ loaded, total }) => {
                        if (total > 0) {
                            const pct = ((loaded / total) * 100).toFixed(1);
                            setStatus(`モデルをダウンロード中... ${pct}%`);
                        }
                    }
                });

                setStatus('✅ モデル準備完了');
                setUIEnabled(true);
                addMessage('system', 'モデルの読み込みが完了しました。日本語で話しかけてください。');
            } catch (err) {
                console.error(err);
                setStatus('❌ モデルの読み込みに失敗: ' + err.message);
            }
        }

        // ===== チャット送信 =====
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            userInput.value = '';
            addMessage('user', text);
            chatHistory.push({ role: 'user', content: text });

            isGenerating = true;
            setUIEnabled(false);

            const assistantDiv = addMessage('assistant', '');
            let fullResponse = '';

            try {
                const stream = await wllama.createChatCompletion({
                    messages: chatHistory,
                    max_tokens: 512,
                    temperature: 0.7,
                    top_k: 40,
                    top_p: 0.9,
                    stream: true,
                });

                for await (const chunk of stream) {
                    const delta = chunk.choices?.[0]?.delta?.content || '';
                    if (delta) {
                        fullResponse += delta;
                        assistantDiv.textContent = fullResponse;
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                }

                chatHistory.push({ role: 'assistant', content: fullResponse });

                if (chatHistory.length > 20) {
                    chatHistory = [chatHistory[0], ...chatHistory.slice(-18)];
                }
            } catch (err) {
                console.error(err);
                assistantDiv.textContent = 'エラー: ' + err.message;
            } finally {
                isGenerating = false;
                setUIEnabled(true);
                userInput.focus();
            }
        }

        // ===== イベント登録 =====
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== 起動 =====
        initModel();
    </script>
</body>
</html>
