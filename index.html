<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wllama Vision (画像認識) テスト</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        .box { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; padding: 10px; font-size: 14px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; background: #10b981; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; color: #d97706; margin-bottom: 10px; }
        #output { white-space: pre-wrap; background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 4px; min-height: 100px; }
        img { max-width: 100%; max-height: 300px; display: block; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Wllama Vision (画像認識) テスト</h1>
    <p>SharedArrayBuffer（覚醒モード）を活かしたローカルマルチモーダル検証</p>

    <div class="box">
        <h3>1. ステータス</h3>
        <div id="status">Wllamaを初期化中... (モデルのロードには数分かかる場合があります)</div>
        <progress id="progress" value="0" max="100" style="width: 100%; display:none;"></progress>
    </div>

    <div class="box">
        <h3>2. 画像とプロンプトの入力</h3>
        <input type="file" id="imageInput" accept="image/*"><br>
        <div id="previewContainer"></div>
        <br>
        <label for="prompt">質問・指示:</label><br>
        <textarea id="prompt">この画像に何が写っているか詳しく説明して。</textarea><br><br>
        <button id="runBtn" disabled>画像認識を実行</button>
    </div>

    <div class="box">
        <h3>出力結果:</h3>
        <div id="output">（ここに結果が表示されます）</div>
    </div>

    <!-- WllamaをCDN経由で読み込む (ES Modules) -->
    <script type="module">
        import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.2.3/esm/index.js';

        // ※注意: マルチモーダル（ビジョン）を動かすには、対応するマルチモーダルGGUFモデルとマルチモーダルプロジェクターが必要です。
        // ここでは例として軽量なマルチモーダルモデルの構成を指定しています。
        // （環境やモデルに合わせて適宜URLを変更してください）
        const CONFIG_WLLAMA = {
            // マルチモーダル対応のWllamaアセットパス
            "supporters": {
                // マルチモーダルに必要なファイルを配置するCDNパスなど
            }
        };

        const statusDiv = document.getElementById('status');
        const progressEl = document.getElementById('progress');
        const runBtn = document.getElementById('runBtn');
        const imageInput = document.getElementById('imageInput');
        const promptInput = document.getElementById('prompt');
        const outputDiv = document.getElementById('output');
        const previewContainer = document.getElementById('previewContainer');

        let wllama = null;
        let base64Image = null;

        // 画像プレビュー処理
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
                base64Image = uploadEvent.target.result;
                previewContainer.innerHTML = `<img src="${base64Image}" alt="プレビュー">`;
            };
            reader.readAsDataURL(file);
        });

        async function initWllama() {
            try {
                statusDiv.textContent = "Wllamaインスタンスを生成中...";
                
                // マルチモーダル対応のWllama設定
                // ※Wllama公式のマルチモーダル対応サンプルに準拠した初期化を行います
                wllama = new Wllama({
                    // シングルスレッド/マルチスレッドの自動判定（SharedArrayBufferが有効ならマルチスレッド発動）
                });

                statusDiv.textContent = "マルチモーダルモデルをロード中（初回はダウンロードに時間がかかります）...";
                progressEl.style.display = "block";

                // 例: マルチモーダル対応モデル（Llama-3.2-11B-Vision等の量子化版など、Wllamaがサポートするビジョンモデルを指定）
                // ※Wllamaでビジョンを扱う際は、プロジェクターファイルやクリップモデルの読み込みが必要になる場合があります。
                await wllama.loadModelFromUrl(
                    'https://huggingface.co/mradermacher/Qwen2.5_VL_2B-GGUF/resolve/main/Qwen2.5_VL_2B.Q4_K_M.gguf',
                    {
                        // 進捗状況のフック
                        onProgress: ({ loaded, total, progress }) => {
                            progressEl.value = progress * 100;
                            statusDiv.textContent = `モデルロード中... ${Math.round(progress * 100)}%`;
                        }
                    }
                );

                statusDiv.textContent = "準備完了！ (SharedArrayBuffer & Vision 稼働中)";
                progressEl.style.display = "none";
                runBtn.disabled = false;

            } catch (err) {
                statusDiv.textContent = `初期化エラー: ${err.message}`;
                console.error(err);
                progressEl.style.display = "none";
            }
        }

        runBtn.addEventListener('click', async () => {
            if (!wllama) return;
            const promptText = promptInput.value.trim();
            if (!promptText) {
                alert("プロンプトを入力してください。");
                return;
            }

            runBtn.disabled = true;
            outputDiv.textContent = "推論中...";

            try {
                // Wllamaでの推論実行（画像データを含むマルチモーダル推論）
                // ※Wllamaのバージョン・ビジョン実装仕様によっては入力形式のメソッドが異なります
                const result = await wllama.createCompletion(promptText, {
                    nPredict: 512,
                    temperature: 0.7,
                    // 画像データがある場合はここに渡す（WllamaのマルチモーダルAPI仕様に準拠）
                    image: base64Image, 
                    onNewToken: (token, piece, text) => {
                        outputDiv.textContent = text;
                    }
                });

                outputDiv.textContent = result;
            } catch (err) {
                outputDiv.textContent = `推論エラー: ${err.message}`;
                console.error(err);
            } finally {
                runBtn.disabled = false;
            }
        });

        // 起動
        initWllama();
    </script>
</body>
</html>
