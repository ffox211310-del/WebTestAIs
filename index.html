<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まよったら — あなたの決断をお手伝い</title>
    <style>
        :root {
            --bg-start: #fdf6f0;
            --bg-mid: #f9ece4;
            --bg-end: #f5e6f0;
            --card-bg: #fffffffa;
            --text-main: #3e3640;
            --text-sub: #6b5e6b;
            --accent: #d4917a;
            --accent-soft: #f0c4b4;
            --accent-glow: #f7ddd3;
            --gold: #c8995c;
            --gold-light: #f2d9b0;
            --coin-front: #f9e4b7;
            --coin-back: #c2996e;
            --shadow-sm: 0 2px 8px rgba(60, 40, 30, 0.06);
            --shadow-md: 0 6px 24px rgba(60, 40, 30, 0.10);
            --shadow-lg: 0 16px 48px rgba(60, 40, 30, 0.14);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-jp: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-jp);
            background: linear-gradient(170deg, var(--bg-start) 0%, var(--bg-mid) 35%, var(--bg-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px 60px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-attachment: fixed;
        }

        /* 背景の装飾 */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            right: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(240, 196, 180, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -140px;
            left: -100px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(210, 180, 200, 0.22) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ---- ヘッダー ---- */
        .header {
            text-align: center;
            padding: 10px 0 6px;
        }
        .header .logo-icon {
            display: inline-block;
            font-size: 44px;
            margin-bottom: 2px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(180, 140, 120, 0.3));
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #4a3832;
            line-height: 1.3;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ---- カード ---- */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 26px 24px 28px;
            box-shadow: var(--shadow-md);
            transition: box-shadow var(--transition-smooth), transform var(--transition-smooth);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        .card__title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a3832;
            letter-spacing: 0.02em;
        }
        .card__title .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent-glow);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ---- プリセットボタン ---- */
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .preset-btn {
            font-family: var(--font-jp);
            font-size: 0.82rem;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1.5px solid #e0d3ca;
            background: #fdfaf8;
            cursor: pointer;
            color: var(--text-sub);
            font-weight: 500;
            transition: all var(--transition-fast);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .preset-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #4a3028;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(200, 150, 120, 0.2);
        }
        .preset-btn:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        /* ---- テキストエリア ---- */
        .option-textarea {
            width: 100%;
            min-height: 90px;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 2px solid #e8ddd5;
            font-family: var(--font-jp);
            font-size: 0.95rem;
            resize: vertical;
            background: #fefcf9;
            color: var(--text-main);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            line-height: 1.6;
            letter-spacing: 0.02em;
        }
        .option-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(212, 145, 122, 0.12);
            background: #fff;
        }
        .option-textarea::placeholder {
            color: #c4b8b0;
        }

        /* ---- メインボタン ---- */
        .btn-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-jp);
            font-size: 1rem;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4917a 0%, #c47a64 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(200, 120, 90, 0.3);
            width: 100%;
            font-size: 1.05rem;
            padding: 16px 32px;
            border-radius: 30px;
            letter-spacing: 0.05em;
        }
        .btn-primary:hover {
            box-shadow: 0 10px 28px rgba(200, 120, 90, 0.4);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #e09a84 0%, #d0846e 100%);
        }
        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(200, 120, 90, 0.3);
            transition: all 0.1s;
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(15%);
        }

        /* ---- 結果表示エリア ---- */
        .result-display {
            margin-top: 16px;
            padding: 18px 20px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #fdf9f5 0%, #fef5f0 100%);
            border: 2px dashed #e8d5c8;
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #4a3028;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .result-display.rolling {
            border-color: var(--accent);
            background: linear-gradient(135deg, #fff8f4 0%, #fff3ec 100%);
            animation: pulse-border 0.5s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                border-color: #e8d5c8;
            }
            50% {
                border-color: var(--accent);
            }
        }
        .result-display.result-final {
            border: 2px solid var(--accent);
            background: linear-gradient(135deg, #fffaf6 0%, #fff5ee 100%);
            animation: celebrate 0.5s ease-out;
            box-shadow: 0 0 0 8px rgba(212, 145, 122, 0.08);
        }
        @keyframes celebrate {
            0% {
                transform: scale(0.94);
                box-shadow: 0 0 0 0px rgba(212, 145, 122, 0.3);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 0 20px rgba(212, 145, 122, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(212, 145, 122, 0.08);
            }
        }
        .result-display .result-text {
            position: relative;
            z-index: 1;
            transition: color 0.3s;
        }
        /* 紙吹雪パーティクル */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 0;
            animation: confetti-fall 0.9s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.3);
            }
        }

        /* ---- コイン ---- */
        .coin-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .coin-scene {
            perspective: 600px;
            width: 130px;
            height: 130px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }
        .coin.flipping {
            animation: coin-flip-anim 2.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        @keyframes coin-flip-anim {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            15% {
                transform: rotateY(180deg) rotateX(8deg);
            }
            30% {
                transform: rotateY(360deg) rotateX(-4deg);
            }
            45% {
                transform: rotateY(540deg) rotateX(6deg);
            }
            60% {
                transform: rotateY(720deg) rotateX(-2deg);
            }
            75% {
                transform: rotateY(900deg) rotateX(3deg);
            }
            88% {
                transform: rotateY(1050deg) rotateX(0deg);
            }
            100% {
                transform: rotateY(var(--final-rotate)) rotateX(0deg);
            }
        }
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            box-shadow: 0 8px 28px rgba(80, 50, 30, 0.2), inset 0 -4px 8px rgba(0, 0, 0, 0.08), inset 0 4px 8px rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }
        .coin-front {
            background: radial-gradient(circle at 35% 35%, #fdf0d0 0%, #e8c97a 50%, #c49a4a 100%);
            color: #6b3a1f;
            text-shadow: 0 2px 3px rgba(255, 255, 255, 0.5);
            z-index: 1;
        }
        .coin-back {
            background: radial-gradient(circle at 35% 35%, #e8d5c0 0%, #c49a70 50%, #8b5e3c 100%);
            color: #fdf0d0;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
            transform: rotateY(180deg);
            z-index: 1;
        }
        /* コインの縁 */
        .coin-edge {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(180, 130, 80, 0.5), 0 0 0 8px rgba(160, 110, 60, 0.3), 0 0 0 11px rgba(140, 95, 50, 0.2);
            pointer-events: none;
            z-index: 0;
        }
        .coin-hint {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
            letter-spacing: 0.03em;
        }
        .coin-result {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a3028;
            min-height: 28px;
            text-align: center;
            letter-spacing: 0.04em;
            transition: all var(--transition-fast);
        }

        /* ---- 乱数ジェネレーター ---- */
        .random-number-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-number {
            width: 90px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 2px solid #e8ddd5;
            font-family: var(--font-jp);
            font-size: 0.95rem;
            text-align: center;
            background: #fefcf9;
            color: var(--text-main);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            letter-spacing: 0.03em;
        }
        .input-number:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(212, 145, 122, 0.12);
            background: #fff;
        }
        .random-number-row .separator {
            font-size: 1.2rem;
            font-weight: 700;
            color: #8a7a70;
        }
        .btn-rand {
            font-family: var(--font-jp);
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #c8995c 0%, #b8834a 100%);
            color: #fff;
            letter-spacing: 0.03em;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px rgba(180, 130, 80, 0.3);
            white-space: nowrap;
        }
        .btn-rand:hover {
            box-shadow: 0 7px 22px rgba(180, 130, 80, 0.4);
            transform: translateY(-1px);
        }
        .btn-rand:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }
        .rand-result {
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            padding: 10px;
            color: #4a3028;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.06em;
            transition: all var(--transition-smooth);
        }
        .rand-result.pop {
            animation: pop-number 0.5s ease-out;
        }
        @keyframes pop-number {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            60% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ---- 今日のひとこと ---- */
        .wisdom-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #5a4a40;
            padding: 8px 4px;
            letter-spacing: 0.03em;
            text-align: center;
            font-style: italic;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity var(--transition-smooth);
        }

        /* ---- フッター ---- */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #b8a8a0;
            letter-spacing: 0.04em;
            padding: 4px 0;
        }

        /* ---- レスポンシブ ---- */
        @media (max-width: 600px) {
            .card {
                padding: 20px 16px 22px;
                border-radius: var(--radius-md);
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header .logo-icon {
                font-size: 36px;
            }
            .btn-primary {
                font-size: 0.95rem;
                padding: 14px 24px;
                border-radius: 26px;
            }
            .result-display {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
            .coin-scene {
                width: 100px;
                height: 100px;
            }
            .coin-face {
                font-size: 2.4rem;
            }
            .random-number-row {
                gap: 8px;
            }
            .input-number {
                width: 70px;
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .preset-btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }
        @media (max-width: 380px) {
            body {
                padding: 10px 8px 40px;
            }
            .card {
                padding: 16px 12px 18px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .coin-scene {
                width: 80px;
                height: 80px;
            }
            .coin-face {
                font-size: 1.8rem;
            }
            .random-number-row {
                flex-direction: column;
                align-items: stretch;
            }
            .input-number {
                width: 100%;
            }
            .btn-rand {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <div class="logo-icon">🎯</div>
            <h1>まよったら</h1>
            <p class="subtitle">あなたの決断を、ちょっと楽しくお手伝い</p>
        </header>

        <!-- カード1: ランダム選択（メイン） -->
        <section class="card" aria-labelledby="picker-title">
            <h2 class="card__title" id="picker-title">
                <span class="icon">🎰</span> 選択ヘルパー
            </h2>
            <div class="preset-row" id="presetRow">
                <button class="preset-btn" data-preset="lunch">🍽️ ランチ</button>
                <button class="preset-btn" data-preset="cafe">☕ カフェ</button>
                <button class="preset-btn" data-preset="activity">🎮 気分転換</button>
                <button class="preset-btn" data-preset="clear">✕ クリア</button>
            </div>
            <textarea
            class="option-textarea"
            id="optionInput"
            placeholder="選択肢を入力してください（改行またはカンマ区切り）&#10;例：&#10;ラーメン&#10;うどん&#10;カレー&#10;寿司"
            aria-label="選択肢入力"
        ></textarea>
        <button class="btn-main btn-primary" id="pickBtn" aria-label="ランダムに選ぶ">
            ✨ まかせて！選ぶ
        </button>
        <div class="result-display" id="resultDisplay" aria-live="polite">
            <span class="result-text" id="resultText">ここに結果が表示されます</span>
        </div>
    </section>

    <!-- カード2: コイン投げ -->
    <section class="card" aria-labelledby="coin-title">
        <h2 class="card__title" id="coin-title">
            <span class="icon">🪙</span> コイン投げ
        </h2>
        <div class="coin-section">
            <div class="coin-scene" id="coinScene" title="タップでコインを投げる">
                <div class="coin" id="coin">
                    <div class="coin-face coin-front">表</div>
                    <div class="coin-face coin-back">裏</div>
                </div>
                <div class="coin-edge"></div>
            </div>
            <p class="coin-hint">👆 タップでコインを投げます</p>
            <p class="coin-result" id="coinResult"></p>
        </div>
    </section>

    <!-- カード3: 乱数生成 -->
    <section class="card" aria-labelledby="rand-title">
        <h2 class="card__title" id="rand-title">
            <span class="icon">🎲</span> 乱数ジェネレーター
        </h2>
        <div class="random-number-row">
            <input type="number" class="input-number" id="randMin" value="1" placeholder="最小" aria-label="最小値">
            <span class="separator">〜</span>
            <input type="number" class="input-number" id="randMax" value="100" placeholder="最大" aria-label="最大値">
            <button class="btn-rand" id="randBtn">生成！</button>
        </div>
        <div class="rand-result" id="randResult" aria-live="polite">1 〜 100</div>
    </section>

    <!-- カード4: 今日のひとこと -->
    <section class="card" aria-labelledby="wisdom-title">
        <h2 class="card__title" id="wisdom-title">
            <span class="icon">💡</span> 今日のひとこと
        </h2>
        <p class="wisdom-text" id="wisdomText"></p>
    </section>

    <!-- フッター -->
    <footer class="footer">
        まよったら © 2026 — 気軽に使ってね
    </footer>
</div>

<script>
    (function() {
        // ==================== DOM要素 ====================
        const optionInput = document.getElementById('optionInput');
        const pickBtn = document.getElementById('pickBtn');
        const resultDisplay = document.getElementById('resultDisplay');
        const resultText = document.getElementById('resultText');
        const presetRow = document.getElementById('presetRow');
        const coinScene = document.getElementById('coinScene');
        const coin = document.getElementById('coin');
        const coinResult = document.getElementById('coinResult');
        const randMin = document.getElementById('randMin');
        const randMax = document.getElementById('randMax');
        const randBtn = document.getElementById('randBtn');
        const randResult = document.getElementById('randResult');
        const wisdomText = document.getElementById('wisdomText');

        // ==================== プリセット ====================
        const presets = {
            lunch: ['ラーメン', 'うどん', 'そば', 'カレーライス', 'ハンバーガー', '寿司', 'ピザ', '弁当', 'オムライス',
                'パスタ', 'サンドイッチ', '牛丼', '天ぷら定食', '麻婆豆腐'
            ],
            cafe: ['コーヒー', 'カフェラテ', 'エスプレッソ', '紅茶', '抹茶ラテ', 'ココア', 'ほうじ茶ラテ', 'チャイ', 'レモネード',
                'ソイラテ', 'カプチーノ', 'アイスティー'
            ],
            activity: ['映画を観る', '散歩する', '読書する', 'ゲームをする', '料理をする', '掃除をする', '昼寝をする', 'ストレッチ',
                '友達に連絡', '音楽を聴く', '日記を書く', '写真を撮る', 'お菓子を作る'
            ],
        };

        presetRow.addEventListener('click', (e) => {
            const btn = e.target.closest('.preset-btn');
            if (!btn) return;
            const presetKey = btn.dataset.preset;
            if (presetKey === 'clear') {
                optionInput.value = '';
                optionInput.focus();
                return;
            }
            if (presets[presetKey]) {
                optionInput.value = presets[presetKey].join('\n');
                optionInput.focus();
                // カーソルを末尾に
                optionInput.setSelectionRange(optionInput.value.length, optionInput.value.length);
            }
        });

        // ==================== 選択肢のパース ====================
        function parseOptions(raw) {
            // 改行とカンマの両方に対応
            const trimmed = raw.trim();
            if (!trimmed) return [];
            // まず改行で分割し、さらにカンマでも分割
            const lines = trimmed.split(/[\n,]/);
            return lines
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }

        // ==================== 紙吹雪エフェクト ====================
        function spawnConfetti(container) {
            const colors = ['#f9c5b6', '#f7ddd3', '#f2d9b0', '#e8c97a', '#d4917a', '#c8995c', '#f0c4b4',
            '#e0c8d8'];
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 24; i++) {
                const particle = document.createElement('div');
                particle.classList.add('confetti');
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 80;
                particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--dy', Math.sin(angle) * distance - 30 + 'px');
                particle.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = (40 + Math.random() * 20) + '%';
                particle.style.top = (35 + Math.random() * 30) + '%';
                particle.style.width = (5 + Math.random() * 7) + 'px';
                particle.style.height = (5 + Math.random() * 7) + 'px';
                particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                particle.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
                fragment.appendChild(particle);
            }
            container.appendChild(fragment);
            // アニメーション終了後に削除
            setTimeout(() => {
                const confettiEls = container.querySelectorAll('.confetti');
                confettiEls.forEach(el => el.remove());
            }, 1000);
        }

        // ==================== ランダム選択（スロット風アニメーション） ====================
        let isRolling = false;

        function pickRandomWithAnimation(options) {
            if (isRolling) return;
            if (options.length === 0) {
                resultText.textContent = '選択肢を入力してください ✍️';
                resultDisplay.classList.remove('result-final', 'rolling');
                return;
            }
            if (options.length === 1) {
                resultText.textContent = '🎯 ' + options[0];
                resultDisplay.classList.add('result-final');
                resultDisplay.classList.remove('rolling');
                spawnConfetti(resultDisplay);
                return;
            }

            isRolling = true;
            pickBtn.disabled = true;
            resultDisplay.classList.add('rolling');
            resultDisplay.classList.remove('result-final');
            resultText.textContent = '選んでいます...';

            const totalDuration = 2400; // ミリ秒
            const totalSwitches = 28;
            const finalIndex = Math.floor(Math.random() * options.length);

            // イージング関数（3次緩出）
            const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

            const timePoints = [];
            for (let i = 0; i < totalSwitches; i++) {
                const normalizedIndex = i / (totalSwitches - 1);
                const easedTime = easeOutCubic(normalizedIndex);
                timePoints.push(easedTime * totalDuration);
            }

            // 各切り替えのタイミングで表示を更新
            const timeouts = [];
            for (let i = 0; i < totalSwitches; i++) {
                const delay = timePoints[i];
                const tId = setTimeout(() => {
                    if (i < totalSwitches - 1) {
                        // ランダムなインデックス（最後以外）
                        const randIdx = Math.floor(Math.random() * options.length);
                        resultText.textContent = options[randIdx];
                    } else {
                        // 最終結果
                        resultText.textContent = '🎯 ' + options[finalIndex];
                        resultDisplay.classList.remove('rolling');
                        resultDisplay.classList.add('result-final');
                        spawnConfetti(resultDisplay);
                        isRolling = false;
                        pickBtn.disabled = false;
                    }
                }, delay);
                timeouts.push(tId);
            }

            // 安全装置：もし何らかの理由で終了しなかった場合
            setTimeout(() => {
                if (isRolling) {
                    resultText.textContent = '🎯 ' + options[finalIndex];
                    resultDisplay.classList.remove('rolling');
                    resultDisplay.classList.add('result-final');
                    spawnConfetti(resultDisplay);
                    isRolling = false;
                    pickBtn.disabled = false;
                }
            }, totalDuration + 300);
        }

        pickBtn.addEventListener('click', () => {
            const raw = optionInput.value;
            const options = parseOptions(raw);
            pickRandomWithAnimation(options);
        });

        // Enter + Ctrl/Cmd で選択実行
        optionInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                const options = parseOptions(optionInput.value);
                pickRandomWithAnimation(options);
            }
        });

        // ==================== コイン投げ ====================
        let isCoinFlipping = false;

        coinScene.addEventListener('click', () => {
            if (isCoinFlipping) return;
            isCoinFlipping = true;
            coinResult.textContent = '...';
            coin.classList.remove('flipping');
            // リフローを強制
            void coin.offsetWidth;

            const isHeads = Math.random() < 0.5;
            // 表: 偶数半回転 (例: 1800deg = 5周 → 表)
            // 裏: 奇数半回転 (例: 1980deg = 5.5周 → 裏)
            const finalRotate = isHeads ? 1800 : 1980;
            coin.style.setProperty('--final-rotate', finalRotate + 'deg');
            coin.classList.add('flipping');

            setTimeout(() => {
                coinResult.textContent = isHeads ? '✨ 表 です！' : '🌙 裏 です！';
                isCoinFlipping = false;
            }, 2300);
        });

        // ==================== 乱数生成 ====================
        function generateRandomNumber() {
            const minVal = parseInt(randMin.value, 10);
            const maxVal = parseInt(randMax.value, 10);

            if (isNaN(minVal) || isNaN(maxVal)) {
                randResult.textContent = '⚠️ 数値を入力してください';
                randResult.classList.remove('pop');
                return;
            }
            if (minVal > maxVal) {
                randResult.textContent = '⚠️ 最小値 ≤ 最大値 にしてください';
                randResult.classList.remove('pop');
                return;
            }
            const result = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
            randResult.textContent = '🎲 ' + result;
            randResult.classList.remove('pop');
            void randResult.offsetWidth;
            randResult.classList.add('pop');
        }

        randBtn.addEventListener('click', generateRandomNumber);

        // Enterキーでも生成
        randMin.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateRandomNumber();
        });
        randMax.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateRandomNumber();
        });

        // ==================== 今日のひとこと ====================
        const wisdomList = [
            '迷ったときは、直感が正解。あなたの心はもう知っている。',
            '完璧を求めすぎないで。まずは一歩、踏み出してみよう。',
            '小さな決断の積み重ねが、明日のあなたをつくる。',
            'どちらを選んでも、きっと大丈夫。大切なのは選んだ後。',
            '休むことも、立派な決断のひとつです。',
            '笑顔になれる方を、選んでみませんか？',
            'あなたの直感は、意外とよくできている。',
            '他人の目より、自分の気持ちを優先していい。',
            '失敗を怖がらなくていい。全部、経験になるから。',
            '選べないのは、どれも魅力的だから。幸せな悩みですね。',
            '今日という日は、一度きり。後悔より挑戦を。',
            '迷う時間も、きっと意味がある。焦らなくて大丈夫。',
            '正解は一つじゃない。あなたの答えが正解になる。',
            '深呼吸して、肩の力を抜いて。リラックスが一番。',
            '自分を信じる気持ちが、最高の決断を導く。',
            '小さな幸せに気づける日は、きっといい日になる。',
            'やらない後悔より、やる後悔。でも無理はしないで。',
            '時にはコインに任せるのも、悪くない選択です。',
            'あなたが思うより、世界はあなたに優しい。',
            '決断に正解はない。でも、誠実さは伝わる。',
            '迷ったら、ちょっとだけ勇気のいる方を選ぼう。',
            '今日のあなたは、昨日より少し強い。',
            '立ち止まることも、前に進む準備になる。',
            '選択肢があること自体が、豊かさの証。',
            '焦らず、じっくり。あなたのペースで大丈夫。',
            '明日の自分が、今日の決断に感謝しますように。',
            '良いことも、そうでないことも、全部味わい深い。',
            'あなたの笑顔が、周りを照らす光になる。',
            '優柔不断は、慎重さの裏返し。悪いことじゃない。',
            'さあ、決めたらあとは楽しむだけ。',
            '人生は長い。ひとつの決断で全部は決まらない。',
        ];

        function getDailyWisdom() {
            const today = new Date();
            const dayOfYear = Math.floor(
                (today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24)
            );
            const index = dayOfYear % wisdomList.length;
            return wisdomList[index];
        }

        wisdomText.textContent = '「 ' + getDailyWisdom() + ' 」';

        // ==================== 初期フォーカス ====================
        // ページ読み込み時に入力欄にフォーカス（モバイルでキーボードが自動で開くのを避けるため少し遅延）
        setTimeout(() => {
            if (window.innerWidth > 768) {
                optionInput.focus();
            }
        }, 400);

        // ==================== キーボードショートカット ====================
        document.addEventListener('keydown', (e) => {
            // 数字キー 1〜4 で各カードにジャンプ的な… ではなくシンプルに
            // 'R' キーで乱数生成（フォーカスが入力欄にない場合）
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey &&
                document.activeElement !== optionInput &&
                document.activeElement !== randMin &&
                document.activeElement !== randMax) {
                e.preventDefault();
                generateRandomNumber();
            }
        });

        console.log('🎯 まよったら — 準備完了！');
        console.log('  💡 ヒント: Ctrl+Enter で選択肢を即実行');
        console.log('  🪙 コインをタップで投げられます');
        console.log('  🎲 Rキーで乱数生成（入力欄以外で）');
    })();
</script>
</body>
</html>
