<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Chrome Built-in AI Chat</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  #chat { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; height: 400px; overflow-y: auto; margin-bottom: 1rem; }
  .msg { margin: 0.5rem 0; padding: 0.5rem 0.8rem; border-radius: 8px; white-space: pre-wrap; }
  .user { background: #e3f2fd; text-align: right; }
  .assistant { background: #f5f5f5; }
  .system { color: #888; font-size: 0.85em; text-align: center; }
  #input-area { display: flex; gap: 0.5rem; }
  #prompt { flex: 1; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 0.6rem 1.2rem; border: none; background: #1a73e8; color: #fff; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<h1>Chrome Built-in AI</h1>
<div id="status">初期化中...</div>
<div id="chat"></div>
<div id="input-area">
  <input id="prompt" placeholder="メッセージを入力..." disabled>
  <button id="send" disabled>送信</button>
</div>

<script>
const statusEl = document.getElementById('status');
const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
let session = null;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function init() {
  if (!('LanguageModel' in self)) {
    statusEl.textContent = '❌ LanguageModel API が利用できません。Chromeのフラグを確認してください。';
    return;
  }
  const avail = await LanguageModel.availability();
  statusEl.textContent = 'ステータス: ' + avail;

  if (avail === 'unavailable') {
    statusEl.textContent = '❌ この環境では利用できません。ハードウェア要件を確認してください。';
    return;
  }

  statusEl.textContent = 'セッション作成中...（初回はモデルDLで数分かかります）';
  session = await LanguageModel.create({
    initialPrompts: [
      { role: 'system', content: 'あなたは親切で丁寧な日本語アシスタントです。簡潔に答えてください。' }
    ],
    monitor(m) {
      m.addEventListener('downloadprogress', e => {
        statusEl.textContent = `モデルDL中: ${(e.loaded * 100).toFixed(1)}%`;
      });
    }
  });

  statusEl.textContent = '✅ 準備完了';
  promptEl.disabled = false;
  sendBtn.disabled = false;
  promptEl.focus();
  addMsg('system', '準備完了。日本語で話しかけてください。');
}

async function send() {
  const text = promptEl.value.trim();
  if (!text || !session) return;
  promptEl.value = '';
  addMsg('user', text);
  sendBtn.disabled = true;

  const assistantDiv = addMsg('assistant', '');
  try {
    const stream = session.promptStreaming(text);
    for await (const chunk of stream) {
      assistantDiv.textContent = chunk;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  } catch (e) {
    assistantDiv.textContent = 'エラー: ' + e.message;
  } finally {
    sendBtn.disabled = false;
    promptEl.focus();
  }
}

sendBtn.addEventListener('click', send);
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

init();
</script>
</body>
</html>
