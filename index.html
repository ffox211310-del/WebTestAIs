<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny LLM - 確率計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tiny LLM</h1>
    <p class="sub">文字単位の超簡易LLM。Transformerなし、逆伝播なし。</p>
  </header>

  <section>
    <h2>① 学習</h2>
    <textarea id="trainText" rows="4" spellcheck="false">abcabcabcabcabcabc</textarea>
    <div class="row">
      <label>繰り返し <input type="number" id="iters" value="10" min="1"></label>
      <button id="learnBtn">学習する</button>
      <button id="resetBtn">リセット</button>
    </div>
  </section>

  <section>
    <h2>② 生成</h2>
    <input type="text" id="prompt" value="a" spellcheck="false" placeholder="プロンプト">
    <div class="row">
      <label>長さ <input type="number" id="length" value="30" min="1"></label>
      <label>温度 <input type="number" id="temp" value="0.8" step="0.1" min="0.1"></label>
      <button id="genBtn">生成する</button>
    </div>
  </section>

  <section>
    <h2>③ 出力</h2>
    <pre id="output"></pre>
    <div id="status" class="status"></div>
  </section>

  <script src="tiny-llm.js"></script>
  <script src="app.js"></script>
</body>
</html>
