<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js WebGPU Instruct テスト</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; background: #0070f3; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin: 15px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; font-weight: bold; }
        #output { white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 4px; min-height: 80px; }
    </style>
</head>
<body>

    <h1>Transformers.js (WebGPU) Instruct テスト</h1>
    <p>モデル: <code>Qwen2.5-0.5B-Instruct</code></p>

    <div id="status">ステータス: 初期化中...</div>

    <label for="prompt">プロンプト (指示):</label><br>
    <textarea id="prompt">日本の首都を教えて。また、そこのおすすめスポットを3つ挙げて。</textarea><br>
    
    <button id="generateBtn" disabled>生成開始</button>

    <h3>出力結果:</h3>
    <div id="output"></div>

    <!-- ES ModulesでTransformers.jsを読み込む -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3';

        const statusDiv = document.getElementById('status');
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('prompt');
        const outputDiv = document.getElementById('output');

        let generator = null;

        async function initAI() {
            try {
                // WebGPUが使えるかざっくりチェック
                if (!navigator.gpu) {
                    throw new Error("このブラウザはWebGPUをサポートしていません。");
                }

                statusDiv.textContent = "ステータス: WebGPUでモデルをロード中... (初回は数100MBのダウンロードがあります)";

                // Text Generationパイプラインの作成 (WebGPU指定 & 4bit量子化)
                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                    device: 'webgpu',
                    dtype: 'q4', // 軽量な4bit量子化
                });

                statusDiv.textContent = "ステータス: 準備完了！ (WebGPU有効)";
                generateBtn.disabled = false;

            } catch (err) {
                console.warn("WebGPUの初期化に失敗しました。WASMフォールバックを試みます...", err);
                try {
                    statusDiv.textContent = "ステータス: WASMモードでモデルをロード中（※低速です）...";
                    generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                        device: 'wasm',
                    });
                    statusDiv.textContent = "ステータス: 準備完了！ (WASMモード)";
                    generateBtn.disabled = false;
                } catch (wasmErr) {
                    statusDiv.textContent = `エラー: ${wasmErr.message}`;
                }
            }
        }

        generateBtn.addEventListener('click', async () => {
            if (!generator) return;

            const text = promptInput.value.trim();
            if (!text) return;

            generateBtn.disabled = true;
            outputDiv.textContent = "";
            statusDiv.textContent = "ステータス: 生成中...";

            // ChatML形式のメッセージ構造
            const messages = [
                { role: "system", content: "あなたは親切なアシスタントです。" },
                { role: "user", content: text }
            ];

            try {
                // ストリーミング風に出力をフックするコールバック
                const timeStart = performance.now();
                let tokenCount = 0;

                const output = await generator(messages, {
                    max_new_tokens: 256,
                    temperature: 0.7,
                    do_sample: true,
                    // トークンが生成されるたびに呼ばれるコールバック
                    callback_function: (outputTokens) => {
                        tokenCount++;
                        // 最新の生成テキストを抽出して表示
                        const generatedText = generator.tokenizer.decode(outputTokens, { skip_special_tokens: true });
                        // 簡易的に末尾を表示（あるいはデコード結果をそのまま反映）
                    },
                    // ※v3のストリーミングは streamer オブジェクトを使うのが主流ですが、
                    // シンプルに一括出力＋テキストエリア表示の例です。
                });

                // 上記の出力結果（messages形式に対応した出力）を取得
                const responseMessage = output[0].generated_text.at(-1).content;
                outputDiv.textContent = responseMessage;

                const timeEnd = performance.now();
                const sec = (timeEnd - timeStart) / 1000;
                statusDiv.textContent = `ステータス: 完了 (生成時間: ${sec.toFixed(2)}秒)`;

            } catch (err) {
                statusDiv.textContent = `エラーが発生しました: ${err.message}`;
                console.error(err);
            } finally {
                generateBtn.disabled = false;
            }
        });

        // 起動時にロード開始
        initAI();
    </script>
</body>
</html>
